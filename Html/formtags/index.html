<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bsic forms</title>
</head>
<body>

    <fieldset>
        <legend align="center">basic form</legend>
        <form>
        <label for="fullname">fullname :</label>
        <input type="text" name="yourname" id ="fullname"  placeholder="enter your name" />

        <br/>

        <br/>



         <label for="email">email :</label>
        <input type="text" name="email" id ="email" placeholder="youremail" />
        <br/>
       <br/>
        <label for="password">password :</label>
        <input type="password" name="password" id ="password" placeholder="your password" />
        <br/>
        <br/>
         <label for="cfpass">cfpassword :</label>
        <input type="password" name="cfpass" id ="cfpass" placeholder="yourcfpass" />
        <br/>
        <br/>
        <label for="dob"> Date of birth :</label>
        <input type="date" name="dob" id="dob" />
        <br/>
        <br/>
        <label for="tob"> Time of birth:</label>
        <input type="time" name="tob" id="tob" 
        />
        <br/>
        <br/>
         <label for="jot"> joining time:</label>
        <input type="datetime-local" name="jot" id="jot" />
        <br/>
        <br/>

        <label for="volume"> volume:</label>
        <input
        type="range"
        name="volume"
        id="volume"
        min="0"
        max="10"
        volume="8"
        />
        <br/>
        <br/>
        <label for="mobile"> mobile:</label>
        <input
        type="number"
        name="mobile"
        id="mobile"
        placeholder="yournumber"
        <br/>
        <br/>
         <label for="resume"> Resume:</label>
        <input type="file" name="resume" id="resume" />
        <br/>
        <br/>
        <label for="address">Address</label>
        <textarea name="address" id="address"></textarea>
        <br/>
        <br/>
        <label for="course">Course:</label>
        <select name="course" id="course">
            <option value="">--Selecct course---</option>
            <option value="btech">B.tech</option>
            <option value="bba"> BBA</option>
            <option value="mba">MBA</option>



        </select>
        <br/>
        <br/>
        <label for="gender">Gender:</label>
        <input type="radio" name="gender" id="male" value="male"> <span>male</span>



        <button>submit</button>
        <button>clear</button>





    </form>
    </fieldset>
    <img src=""
    
</body>
</html>
